<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Lyon - Tourist Guide</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/animations.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-container">
            <div class="logo">Lyon Tourisme</div>
            <ul class="nav-links">
                <li><a href="#attractions">Attractions</a></li>
                <li><a href="#video">Discover</a></li>
                <li><a href="#essential">Information</a></li>
                <li><a href="#events">Latest Events</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cta-section">
            <picture class="cta-bg">
                <source media="(max-width: 759px)" srcset="./images/cover-low-res.jpg">
                <source media="(min-width: 760px)" srcset="./images/cover.jpg">
                <img src="./images/cover.jpg" alt="Panoramic view of Lyon city center">
            </picture>
            <div class="cta-content">
                <button class="cta-btn" id="ctaButton">
                    <span>Call to Action</span>
                </button>
            </div>
        </section>

        

        <section id="video" class="video-section">
            <div class="container">
                <video id="touristVideo" muted loop playsinline width="100%" aria-label="Lyon tourism promotional video">
                    <source src="./videos/lyon.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>

        <section id="essential" class="essential-section">
            <div class="container">
                <h2>Essential Information</h2>
                <div class="info-box">
                    <p id="addressText"><strong>Address:</strong> Place Bellecour, 69002 Lyon, France</p>
                    <p><strong>Phone:</strong> +33 4 72 77 69 69</p>
                    <button id="speakButton" aria-label="Pronounce address information out loud in French">🔊 Listen (French)</button>
                </div>
            </div>
        </section>

        <section id="events" class="events-section">
            <div class="container">
                <h2>Latest Events</h2>
                <div class="events-slider" id="eventsSlider" role="region" aria-live="polite" aria-label="Latest events timeline">
                    </div>
            </div>
        </section>

        <section class="tabs-section">
            <div class="container">
                <h2>More Information</h2>
                <custom-tabs id="infoTabs"></custom-tabs>
            </div>
        </section>

        <section id="contact" class="contact-section">
            <div class="container">
                <h2>Contact Us</h2>
                <form action="" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input type="text" id="firstName" name="firstName" required tabindex="1">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input type="text" id="lastName" name="lastName" required tabindex="2">
                    </div>
                    <div class="form-group">
                        <label for="email">Contact Email Address</label>
                        <input type="email" id="email" name="email" required tabindex="3">
                    </div>
                    <div class="form-group">
                        <label for="phone">Contact Phone Number</label>
                        <input type="tel" id="phone" name="phone" required tabindex="4">
                    </div>
                    <button type="submit" tabindex="5">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="main-footer" id="mainFooter">
        </footer>

    <script src="./js/main.js"></script>
    <script src="./js/video.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/speech.js"></script>
    <script src="./js/events.js"></script>
    <script src="./js/tabs.js"></script>
</body>
</html>
